<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — StitchCraft Account</title>
  <meta name="description" content="Sign in to your StitchCraft account to track alterations, manage bookings and review past orders.">
  <meta name="author" content="StitchCraft">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%2326221b'/%3E%3Ctext x='50' y='66' font-size='46' text-anchor='middle'%3E%E2%9C%82%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Floating toggles (standalone page, no nav) -->
  <div class="position-fixed top-0 end-0 p-3 d-flex gap-2" style="z-index:1050;">
    <button class="theme-toggle d-inline-grid" id="themeToggle" type="button" title="Toggle dark / light mode" aria-label="Toggle theme">
      <i class="bi bi-moon-stars"></i><i class="bi bi-sun"></i>
    </button>
    <button class="rtl-toggle d-inline-block" id="rtlToggle" type="button" title="Toggle LTR / RTL layout">RTL</button>
  </div>

  <div class="auth-wrap">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-8 reveal">
          <div class="auth-card">
            <!-- Brand -->
            <a class="brand mb-4" href="index.html">
              <span class="brand-logo"><i class="bi bi-scissors"></i></span>
              <span class="brand-name">StitchCraft<small>Tailor &amp; Alterations</small></span>
            </a>

            <h2 class="section-title mb-1">Welcome back</h2>
            <p class="text-muted-2 mb-4">Sign in to track your alterations and manage bookings.</p>

            <!-- Login form (client-side demo auth via auth.js) -->
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label" for="loginEmail">Email address</label>
                <div class="input-icon">
                  <i class="bi bi-envelope"></i>
                  <input type="email" class="form-control" id="loginEmail" placeholder="you@example.com" required>
                </div>
              </div>
              <div class="mb-2">
                <label class="form-label" for="loginPass">Password</label>
                <div class="input-icon">
                  <i class="bi bi-lock"></i>
                  <input type="password" class="form-control" id="loginPass" placeholder="••••••••" required>
                </div>
              </div>
              <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="rememberMe">
                  <label class="form-check-label fs-7" for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="link-arrow fs-7">Forgot password?</a>
              </div>
              <button type="submit" class="btn btn-accent btn-lg w-100"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</button>
            </form>

            <hr class="my-4">
            <div class="text-center fs-7 text-muted-2 mb-3">or continue with</div>
            <div class="row g-2 mb-4">
              <div class="col-4">
                <button type="button" class="btn btn-outline-dark w-100" aria-label="Sign in with Google"><i class="bi bi-google"></i></button>
              </div>
              <div class="col-4">
                <button type="button" class="btn btn-outline-dark w-100" aria-label="Sign in with Facebook"><i class="bi bi-facebook"></i></button>
              </div>
              <div class="col-4">
                <button type="button" class="btn btn-outline-dark w-100" aria-label="Sign in with Apple"><i class="bi bi-apple"></i></button>
              </div>
            </div>

            <p class="text-center fs-7 mb-0 text-muted-2">New to StitchCraft? <a href="register.html" class="link-arrow">Create an account</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
